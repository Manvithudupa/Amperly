[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.6.1"
material = "1.11.0"
activityKtx = "1.8.2"
constraintlayout = "2.1.4"
carApp = "1.4.0"
room = "2.6.1"
playServicesLocation = "21.2.0"
playServicesMaps = "18.2.0"
navigation = "2.7.7"
lifecycle = "2.7.0"
swiperefreshlayout = "1.1.0"
zxing = "3.5.3"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Android for Cars
carapp = { group = "androidx.car.app", name = "app", version.ref = "carApp" }

# Room
roomruntime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
roomcompiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Play Services
playserviceslocation = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
playservicesmaps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }

# Navigation & Lifecycle
navfragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
lifecyclevm = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycledata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# ZXing for QR codes
zxing = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
